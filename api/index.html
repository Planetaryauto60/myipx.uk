<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="application/json">
    <title>JSON Response</title>
</head>
<body>
    <script>
        // Create a JSON array
        const jsonArray = [
            { "id": 1, "name": "Alice", "age": 25 },
            { "id": 2, "name": "Bob", "age": 30 },
            { "id": 3, "name": "Charlie", "age": 35 }
        ];

        // Output the JSON array to the browser
        document.body.innerHTML = JSON.stringify(jsonArray);
    </script>
</body>
</html>
