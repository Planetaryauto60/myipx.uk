

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>getmyip.uk</title>
  <style>
    body {
      background: #121212;
      color: #e5e5e5;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 15px;
      font-weight: 600;
      color: #4db8ff;
      letter-spacing: 1px;
    }
    .info {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 650px;
      margin-top: 20px;
    }
    pre {
      font-size: 1.1rem;
      text-align: left;
      color: #d0d0d0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .badge {
      display: inline-block;
      padding: 8px 15px;
      border-radius: 4px;
      font-weight: 500;
      margin-left: 10px;
    }
    .badge.good { background: #28a745; color: white; }
    .badge.suspicious { background: #ffbb33; color: white; }
    .badge.bot { background: #dc3545; color: white; }
    #map {
      width: 100%;
      border-radius: 8px;
      margin-top: 25px;
    }
    .footer {
      margin-top: 30px;
      font-size: 1rem;
      opacity: 0.6;
      color: #9e9e9e;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <h1>myipx.uk</h1>

  <div class="info">
    <pre>
<b>IP Address:</b> 212.132.62.241
<b>Country:</b>    GB
<b>Region:</b>     England
<b>City:</b>       Chelmsford
<b>ASN:</b>        AS56329 (Gigaclear)
<b>Data Center:</b> LHR
<b>Device:</b>     Desktop
<b>Bot Detection:</b> <span class="badge unknown">Unknown</span>
    </pre>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Set the map height to be the same as the .info div
    window.onload = () => {
      const infoHeight = document.querySelector('.info').offsetHeight;
      const mapElement = document.getElementById('map');
      mapElement.style.height = `${infoHeight}px`; // Set map height to match .info div

      const map = L.map('map').setView([51.73350, 0.46510], 10);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '',
        maxZoom: 19,
      }).addTo(map);
      L.marker([51.73350, 0.46510]).addTo(map)
        .bindPopup('You are here!')
        .openPopup();
    }
  </script>
</body>
</html>
