<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IP Info</title>
  <script>
    async function outputJson() {
      try {
        const res = await fetch('https://www.cloudflare.com/cdn-cgi/trace');
        const text = await res.text();
        const info = {};
        text.trim().split('\n').forEach(line => {
          const [key, value] = line.split('=');
          info[key] = value;
        });

        const output = [{
          ip: info.ip || 'Unknown',
          location: info.loc || 'Unknown',
          userAgent: navigator.userAgent,
          time: new Date().toISOString()
        }];

        // Replace entire page with JSON
        document.open();
        document.write(JSON.stringify(output));
        document.close();
      } catch (error) {
        document.open();
        document.write(JSON.stringify([{ error: "Failed to fetch IP info" }]));
        document.close();
      }
    }

    outputJson();
  </script>
</head>
<body></body>
</html>
