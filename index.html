<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111315">
  <meta name="description" content="View the public IP address used by your connection.">
  <title>myipx.uk — IP address</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="viewer">
    <header><a class="brand" href="/">myipx.uk</a><span class="status"><i></i> online</span></header>
    <section class="address" aria-labelledby="title">
      <p class="label" id="title">YOUR IP ADDRESS</p>
      <output id="ip" aria-live="polite">—</output>
      <div class="meta"><span id="family">Checking connection…</span><button id="copy-btn" type="button" disabled>Copy</button></div>
      <p id="hint" class="hint" aria-live="polite"></p>
    </section>
    <footer><a href="/api">JSON API</a><span>No tracking · No third-party requests</span></footer>
  </main>
</body>
</html>
